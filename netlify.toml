[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/writing/"
  status = 301
